<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edukids Pintar - Jom Belajar & Bermain!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #F0FDF4;
        }
        .font-kids {
            font-family: 'Fredoka One', cursive;
        }
        .pop-button {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .pop-button:active {
            transform: scale(0.92);
        }
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="select-none overflow-x-hidden text-slate-700">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col justify-between pb-6">
        
        <!-- HEADER UTAMA -->
        <header id="main-header" class="hidden bg-gradient-to-b from-yellow-300 to-amber-400 p-4 rounded-b-3xl shadow-md flex justify-between items-center z-10">
            <div class="flex items-center space-x-2" onclick="goHome()">
                <div class="bg-white p-2 rounded-full shadow-inner text-2xl cursor-pointer">🎒</div>
                <div>
                    <h1 class="font-kids text-2xl text-amber-900 tracking-wide leading-none">Edukids Pintar</h1>
                    <div class="flex items-center space-x-1 mt-0.5 text-xs font-bold text-amber-950 bg-yellow-200 px-2 py-0.5 rounded-full">
                        <span id="header-avatar">👦</span> <span id="header-name">Adik</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div class="bg-amber-100 px-3 py-1.5 rounded-full flex items-center space-x-1 shadow-sm font-bold text-amber-800">
                    <span>⭐</span>
                    <span id="global-stars">0</span>
                </div>
                <button onclick="logoutToWelcome()" class="bg-red-500 hover:bg-red-600 text-white p-2.5 rounded-full shadow pop-button">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- KANDUNGAN UTAMA -->
        <main class="flex-grow p-4 flex flex-col justify-center">
            
            <!-- 0. HALAMAN WELCOME -->
            <section id="view-welcome" class="space-y-6 text-center">
                <div class="floating text-6xl my-4">🎒✨🏫</div>
                <h2 class="font-kids text-4xl text-emerald-600 mb-2">Edukids Pintar</h2>
                <p class="text-gray-500 font-bold px-4">Selamat datang! Sila pilih mod log masuk di bawah.</p>
                <div class="space-y-4 pt-4 px-2">
                    <button onclick="switchView('view-select-child')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-kids text-xl py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 pop-button flex items-center justify-center space-x-3">
                        <span>👦👧</span> <span>MASUK SEBAGAI ANAK</span>
                    </button>
                    <button onclick="switchView('view-parents')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-kids text-xl py-4 rounded-2xl shadow-lg border-b-4 border-purple-800 pop-button flex items-center justify-center space-x-3">
                        <span>🛠️</span> <span>RUANG IBU BAPA</span>
                    </button>
                </div>
            </section>

            <!-- 0.1 PILIH PROFIL ANAK -->
            <section id="view-select-child" class="hidden space-y-4">
                <div class="flex items-center space-x-2 mb-4">
                    <button onclick="switchView('view-welcome')" class="bg-gray-200 p-2 rounded-full pop-button"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                    <h2 class="font-kids text-2xl text-emerald-600">Pilih Profil Anda</h2>
                </div>
                <div id="child-profiles-list" class="grid grid-cols-2 gap-4"></div>
            </section>

            <!-- 2. MENU UTAMA -->
            <section id="view-home" class="hidden space-y-4">
                <div class="text-center bg-blue-50 py-3 px-4 rounded-2xl border-2 border-blue-200">
                    <h2 class="font-kids text-xl text-blue-600">Hai <span id="user-greeting-name">Adik</span>! 👋</h2>
                    <p class="text-sm font-bold text-blue-800">Skor Bintang: <span id="streak-count">0</span> ⭐</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="enterCategory('matematik')" class="bg-rose-100 hover:bg-rose-200 p-4 rounded-2xl border-b-4 border-rose-300 text-left space-y-1 pop-button flex flex-col justify-between h-28">
                        <span class="text-3xl">🔢</span>
                        <div>
                            <h3 class="font-kids text-sm text-rose-700">Matematik</h3>
                            <p class="text-[9px] text-rose-600 font-bold">Nombor & Gambar</p>
                        </div>
                    </button>
                    <button onclick="enterCategory('bm')" class="bg-amber-100 hover:bg-amber-200 p-4 rounded-2xl border-b-4 border-amber-300 text-left space-y-1 pop-button flex flex-col justify-between h-28">
                        <span class="text-3xl">📖</span>
                        <div>
                            <h3 class="font-kids text-sm text-amber-700">Abjad Melayu</h3>
                            <p class="text-[9px] text-amber-600 font-bold">Huruf Kecil & Besar</p>
                        </div>
                    </button>
                    <button onclick="enterCategory('haiwan')" class="bg-emerald-100 hover:bg-emerald-200 p-4 rounded-2xl border-b-4 border-emerald-300 text-left space-y-1 pop-button flex flex-col justify-between h-28">
                        <span class="text-3xl">🐯</span>
                        <div>
                            <h3 class="font-kids text-sm text-emerald-700">Kenali Haiwan</h3>
                            <p class="text-[9px] text-emerald-600 font-bold">Teka Nama Haiwan</p>
                        </div>
                    </button>
                    <button onclick="enterCategory('warna')" class="bg-purple-100 hover:bg-purple-200 p-4 rounded-2xl border-b-4 border-purple-300 text-left space-y-1 pop-button flex flex-col justify-between h-28">
                        <span class="text-3xl">🎨</span>
                        <div>
                            <h3 class="font-kids text-sm text-purple-700">Warna & Bentuk</h3>
                            <p class="text-[9px] text-purple-600 font-bold">Cari Warna Seiras</p>
                        </div>
                    </button>
                    <button onclick="enterCategory('buah')" class="bg-orange-100 hover:bg-orange-200 p-4 rounded-2xl border-b-4 border-orange-300 text-left space-y-1 pop-button flex flex-col justify-between h-28 col-span-2">
                        <span class="text-3xl">🍎</span>
                        <div>
                            <h3 class="font-kids text-sm text-orange-700">Kenali Buah-Buahan</h3>
                            <p class="text-[9px] text-orange-600 font-bold">Belajar Nama Buah Sihat</p>
                        </div>
                    </button>
                </div>
            </section>

            <!-- 3. PETA LEVEL & TETAPAN PERMAINAN -->
            <section id="view-map" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <button onclick="goHome()" class="bg-gray-200 text-gray-700 font-bold px-3 py-1.5 rounded-full text-xs pop-button flex items-center">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5 mr-1"></i> Utama
                    </button>
                    <h2 id="map-title" class="font-kids text-xl text-indigo-600">Peta Pembelajaran</h2>
                    <div class="w-14"></div>
                </div>

                <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-200 space-y-3 text-sm">
                    <div>
                        <label class="block font-bold text-indigo-900 mb-1">1. Bilangan Soalan:</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setQuestionCount(5, this)" class="btn-qcount bg-indigo-600 text-white font-bold py-1.5 rounded-xl border-2 border-indigo-700 pop-button">5</button>
                            <button onclick="setQuestionCount(10, this)" class="btn-qcount bg-white text-indigo-700 font-bold py-1.5 rounded-xl border border-gray-300 pop-button">10</button>
                            <button onclick="setQuestionCount(20, this)" class="btn-qcount bg-white text-indigo-700 font-bold py-1.5 rounded-xl border border-gray-300 pop-button">20</button>
                        </div>
                    </div>
                </div>

                <!-- PETA KESUKARAN (PERKATAAN TAHAP DIBUANG) -->
                <div class="bg-slate-50 rounded-3xl p-6 min-h-[300px] flex flex-col items-center justify-around relative border-4 border-dashed border-slate-200">
                    <div class="flex flex-col items-center z-10">
                        <button onclick="startLevel('pro')" class="w-24 h-14 rounded-2xl font-kids text-sm shadow-lg flex items-center justify-center pop-button border-4 bg-red-500 border-red-700 text-white"><span>PRO</span></button>
                    </div>
                    <div class="flex flex-col items-center z-10">
                        <button onclick="startLevel('sederhana')" class="w-24 h-14 rounded-2xl font-kids text-sm shadow-lg flex items-center justify-center pop-button border-4 bg-orange-400 border-orange-600 text-white"><span>SEDERHANA</span></button>
                    </div>
                    <div class="flex flex-col items-center z-10">
                        <button onclick="startLevel('mudah')" class="w-24 h-14 rounded-2xl font-kids text-sm shadow-lg flex items-center justify-center pop-button border-4 bg-emerald-500 border-emerald-700 text-white animate-bounce"><span>MUDAH</span></button>
                    </div>
                </div>
            </section>

            <!-- 4. PERMAINAN / KUIZ AKTIF -->
            <section id="view-game" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded-xl">
                    <button onclick="exitGame()" class="text-gray-400 font-bold text-xs hover:text-red-500">Keluar ❌</button>
                    <div class="w-2/3 bg-gray-200 rounded-full h-3.5 overflow-hidden">
                        <div id="game-progress" class="bg-emerald-500 h-3.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <div class="text-xs font-bold text-slate-500"><span id="q-current">1</span>/<span id="q-total">5</span></div>
                </div>

                <div class="bg-amber-50 rounded-3xl p-6 border-4 border-amber-300 text-center min-h-[180px] flex flex-col justify-center items-center relative">
                    <h3 id="game-instruction" class="text-sm font-bold text-amber-800 uppercase tracking-wider mb-2"></h3>
                    <div id="game-main-display" class="font-kids text-4xl text-amber-900 my-4 tracking-widest break-all flex flex-col items-center justify-center"></div>
                </div>

                <div id="game-options" class="grid grid-cols-1 gap-3"></div>
                <div id="game-feedback" class="hidden p-4 rounded-2xl text-center font-bold text-lg animate-pulse"></div>
            </section>

            <!-- 5. SKRIN TAHNIAH -->
            <section id="view-congrats" class="hidden text-center space-y-6">
                <div class="floating text-7xl my-4">🏆🎉⭐</div>
                <h2 class="font-kids text-3xl text-yellow-600">Tahniah! Kamu Hebat!</h2>
                <div class="bg-yellow-50 p-6 rounded-3xl border-4 border-yellow-300 inline-block min-w-[200px]">
                    <p class="text-sm font-bold text-yellow-800 uppercase tracking-wider">Bintang Diperoleh</p>
                    <div class="flex justify-center items-center space-x-2 my-2">
                        <span class="text-3xl">⭐</span>
                        <span id="congrats-stars" class="font-kids text-4xl text-amber-700">+5</span>
                    </div>
                </div>
                <button onclick="goHome()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-kids text-xl py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 pop-button">
                    MAIN LAGI! 🎮
                </button>
            </section>

            <!-- 6. PARENTS DASHBOARD -->
            <section id="view-parents" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-kids text-2xl text-purple-700">Ruang Pentadbir</h2>
                    <button onclick="switchView('view-welcome')" class="bg-gray-200 text-gray-700 font-bold px-3 py-1 rounded-full text-xs pop-button">Keluar</button>
                </div>
                <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200 space-y-3">
                    <input type="text" id="new-child-name" placeholder="Nama Anak" class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none">
                    <button onclick="addNewChildProfile()" class="w-full bg-purple-600 text-white font-bold py-2 rounded-xl text-sm pop-button shadow">+ Simpan Profil</button>
                </div>
                <div id="parent-users-list" class="space-y-2"></div>
            </section>

        </main>

        <footer class="px-4 pt-2 border-t border-gray-100">
            <p class="text-center text-[10px] text-gray-400 font-medium">Edukids Pintar &copy; 2026</p>
        </footer>
    </div>

    <script>
        let usersDatabase = [];
        let activeUserIndex = null;
        let selectedQuestionCount = 5; 
        let currentCategory = '';
        let currentLevel = 'mudah';
        let currentQuestionIndex = 0;
        let questionsList = [];
        let correctAnswer = null;

        const buahList = ["🍎", "🍌", "🍇", "🍊", "🍓", "🍉"];
        const haiwanList = ["🐱", "🦁", "🐰", "🐼", "🐵", "🐤"];
        const abjadBMList = ["A", "B", "C", "D", "E", "I", "U", "O"];
        
        const dataHaiwan = [
            { nama: "Kucing", visual: "🐱" }, { nama: "Singa", visual: "🦁" },
            { nama: "Arnab", visual: "🐰" }, { nama: "Panda", visual: "🐼" },
            { nama: "Monyet", visual: "🐵" }, { nama: "Ayam", visual: "🐔" },
            { nama: "Gajah", visual: "🐘" }, { nama: "Katak", visual: "🐸" }
        ];

        const dataWarnaBentuk = [
            { nama: "Merah", visual: "🔴" }, { nama: "Biru", visual: "🔵" },
            { nama: "Kuning", visual: "🟡" }, { nama: "Hijau", visual: "🟢" },
            { nama: "Segitiga", visual: "🔺" }, { nama: "Bulat", visual: "⭕" }
        ];

        const dataBuahDua = [
            { nama: "Epal", visual: "🍎" }, { nama: "Pisang", visual: "🍌" },
            { nama: "Anggur", visual: "🍇" }, { nama: "Oren", visual: "🍊" },
            { nama: "Strawberi", visual: "🍓" }, { nama: "Tembikai", visual: "🍉" }
        ];

        window.onload = function() {
            lucide.createIcons();
            loadDatabase();
        };

        function loadDatabase() {
            let saved = localStorage.getItem('edukids_db_v4');
            if (saved) {
                usersDatabase = JSON.parse(saved);
            } else {
                usersDatabase = [{ name: "Adik", avatar: "👦", stars: 0 }];
                localStorage.setItem('edukids_db_v4', JSON.stringify(usersDatabase));
            }
            renderChildProfilesSelect();
        }

        function switchView(viewId) {
            const views = ['view-welcome', 'view-select-child', 'view-home', 'view-map', 'view-game', 'view-congrats', 'view-parents'];
            views.forEach(v => document.getElementById(v)?.classList.add('hidden'));
            document.getElementById(viewId)?.classList.remove('hidden');

            if (['view-home', 'view-map', 'view-game', 'view-congrats'].includes(viewId)) {
                document.getElementById('main-header').classList.remove('hidden');
            } else {
                document.getElementById('main-header').classList.add('hidden');
            }
            lucide.createIcons();
        }

        function renderChildProfilesSelect() {
            const container = document.getElementById('child-profiles-list');
            if (!container) return;
            container.innerHTML = '';
            usersDatabase.forEach((user, index) => {
                container.innerHTML += `
                    <button onclick="loginAsChild(${index})" class="bg-white border-4 border-emerald-300 rounded-3xl p-4 flex flex-col items-center justify-center space-y-2 pop-button shadow-sm w-full">
                        <span class="text-4xl">${user.avatar}</span>
                        <span class="font-kids text-lg text-emerald-800">${user.name}</span>
                    </button>
                `;
            });
        }

        function loginAsChild(index) {
            activeUserIndex = index;
            let user = usersDatabase[activeUserIndex];
            document.getElementById('header-name').innerText = user.name;
            document.getElementById('user-greeting-name').innerText = user.name;
            document.getElementById('global-stars').innerText = user.stars;
            document.getElementById('streak-count').innerText = user.stars;
            switchView('view-home');
        }

        function setQuestionCount(count, btn) {
            selectedQuestionCount = count;
            document.querySelectorAll('.btn-qcount').forEach(b => {
                b.classList.replace('bg-indigo-600', 'bg-white');
                b.classList.replace('text-white', 'text-indigo-700');
            });
            btn.classList.replace('bg-white', 'bg-indigo-600');
            btn.classList.replace('text-indigo-700', 'text-white');
        }

        function enterCategory(category) {
            currentCategory = category;
            const titles = { 
                matematik: "🔢 Matematik Pintar", 
                bm: "📖 Abjad Melayu", 
                haiwan: "🐯 Kenali Haiwan",
                warna: "🎨 Warna & Bentuk",
                buah: "🍎 Kenali Buah"
            };
            document.getElementById('map-title').innerText = titles[category] || "Pintar";
            switchView('view-map');
        }

        function startLevel(lvl) {
            currentLevel = lvl;
            currentQuestionIndex = 0;
            questionsList = generateQuestions(currentCategory, lvl, selectedQuestionCount);
            document.getElementById('q-total').innerText = questionsList.length;
            loadQuestion();
            switchView('view-game');
        }

        function generateQuestions(cat, lvl, count) {
            let list = [];
            for (let i = 0; i < count; i++) {
                if (cat === 'matematik') {
                    // LEVEL 1 & LEVEL 2: NOMBOR SAHAJA
                    if (lvl === 'mudah' || lvl === 'sederhana') {
                        let targetNum = lvl === 'mudah' ? Math.floor(Math.random() * 5) + 1 : Math.floor(Math.random() * 5) + 6;
                        let options = shuffle([targetNum, targetNum + 1, targetNum - 1].filter(n => n > 0));
                        if(options.length < 3) options.push(targetNum + 2);
                        list.push({
                            inst: "Pilih nombor yang betul:",
                            q: targetNum,
                            ans: targetNum,
                            opts: shuffle(options)
                        });
                    } 
                    // LEVEL 3 (PRO): KIRA GAMBAR (TAMBAH & TOLAK VISUAL)
                    else {
                        let pool = Math.random() > 0.5 ? buahList : haiwanList;
                        let icon = pool[Math.floor(Math.random() * pool.length)];
                        if (Math.random() > 0.5) {
                            let n1 = Math.floor(Math.random() * 2) + 1;
                            let n2 = Math.floor(Math.random() * 2) + 1;
                            let total = n1 + n2;
                            list.push({
                                inst: "Kira jumlah semua gambar:",
                                q: icon.repeat(n1) + " ➕ " + icon.repeat(n2),
                                ans: total,
                                opts: shuffle([total, total + 1, total - 1].filter(n => n > 0))
                            });
                        } else {
                            let n1 = Math.floor(Math.random() * 2) + 3; 
                            let n2 = Math.floor(Math.random() * 2) + 1; 
                            let baki = n1 - n2;
                            list.push({
                                inst: "Kira gambar yang tinggal:",
                                q: icon.repeat(n1) + " ➖ " + icon.repeat(n2),
                                ans: baki,
                                opts: shuffle([baki, baki + 1, baki + 2])
                            });
                        }
                    }
                } else if (cat === 'bm') {
                    let targetAbjad = abjadBMList[Math.floor(Math.random() * abjadBMList.length)];
                    let wrongOpts = abjadBMList.filter(a => a !== targetAbjad);
                    shuffle(wrongOpts);
                    list.push({
                        inst: "Mana abjad yang sepadan?",
                        q: targetAbjad,
                        ans: targetAbjad,
                        opts: shuffle([targetAbjad, wrongOpts[0], wrongOpts[1]])
                    });
                } else if (cat === 'haiwan') {
                    let target = dataHaiwan[Math.floor(Math.random() * dataHaiwan.length)];
                    let wrg = dataHaiwan.filter(h => h.nama !== target.nama);
                    shuffle(wrg);
                    list.push({
                        inst: "Ini haiwan apa ya?",
                        q: target.visual,
                        ans: target.nama,
                        opts: shuffle([target.nama, wrg[0].nama, wrg[1].nama])
                    });
                } else if (cat === 'warna') {
                    let target = dataWarnaBentuk[Math.floor(Math.random() * dataWarnaBentuk.length)];
                    let wrg = dataWarnaBentuk.filter(w => w.nama !== target.nama);
                    shuffle(wrg);
                    list.push({
                        inst: "Pilih nama warna/bentuk ini:",
                        q: target.visual,
                        ans: target.nama,
                        opts: shuffle([target.nama, wrg[0].nama, wrg[1].nama])
                    });
                } else if (cat === 'buah') {
                    let target = dataBuahDua[Math.floor(Math.random() * dataBuahDua.length)];
                    let wrg = dataBuahDua.filter(b => b.nama !== target.nama);
                    shuffle(wrg);
                    list.push({
                        inst: "Ini buah apa?",
                        q: target.visual,
                        ans: target.nama,
                        opts: shuffle([target.nama, wrg[0].nama, wrg[1].nama])
                    });
                }
            }
            return list;
        }

        function loadQuestion() {
            let currentQ = questionsList[currentQuestionIndex];
            document.getElementById('q-current').innerText = currentQuestionIndex + 1;
            
            let pct = (currentQuestionIndex / questionsList.length) * 100;
            document.getElementById('game-progress').style.width = pct + "%";

            document.getElementById('game-instruction').innerText = currentQ.inst;
            document.getElementById('game-main-display').innerText = currentQ.q;
            document.getElementById('game-feedback').classList.add('hidden');

            correctAnswer = currentQ.ans;

            let optContainer = document.getElementById('game-options');
            optContainer.innerHTML = '';
            
            currentQ.opts.forEach(opt => {
                optContainer.innerHTML += `
                    <button onclick="checkAnswer('${opt}')" class="w-full bg-white hover:bg-amber-100 text-slate-800 font-kids text-xl py-3 rounded-2xl border-2 border-gray-300 shadow-sm pop-button">
                        ${opt}
                    </button>
                `;
            });
        }

        function checkAnswer(chosen) {
            let fb = document.getElementById('game-feedback');
            fb.classList.remove('hidden');

            if (String(chosen) === String(correctAnswer)) {
                fb.className = "p-3 rounded-2xl text-center font-bold text-base bg-emerald-100 text-emerald-800 animate-bounce";
                fb.innerText = "Hebat! Jawapan Betul! 🎉";
                
                usersDatabase[activeUserIndex].stars += 1;
                localStorage.setItem('edukids_db_v4', JSON.stringify(usersDatabase));
                document.getElementById('global-stars').innerText = usersDatabase[activeUserIndex].stars;

                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questionsList.length) {
                        loadQuestion();
                    } else {
                        document.getElementById('congrats-stars').innerText = `+${questionsList.length}`;
                        switchView('view-congrats');
                    }
                }, 1200);
            } else {
                fb.className = "p-3 rounded-2xl text-center font-bold text-base bg-orange-100 text-orange-800";
                fb.innerText = "Cuba lagi sayang! 😊";
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function goHome() { switchView('view-home'); }
        function exitGame() { switchView('view-map'); }
        function logoutToWelcome() { switchView('view-welcome'); }

        function addNewChildProfile() {
            let nameInput = document.getElementById('new-child-name').value.trim();
            if (!nameInput) return alert("Sila isi nama profil!");
            usersDatabase.push({ name: nameInput, avatar: "👧", stars: 0 });
            localStorage.setItem('edukids_db_v4', JSON.stringify(usersDatabase));
            document.getElementById('new-child-name').value = '';
            renderChildProfilesSelect();
            alert("Profil berjaya disimpan!");
        }
    </script>
</body>
</html>
