<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAMBAH - Tambah Ilmu, Naik Level!</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Animasi Custom */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #f0f9ff; touch-action: manipulation; user-select: none; }
        .app-container { max-width: 480px; margin: 0 auto; height: 100vh; background: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bounce-soft { animation: bounceSoft 2s infinite; }
        @keyframes bounceSoft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        
        .fire-glow { filter: drop-shadow(0 0 8px rgba(255, 165, 0, 0.8)); animation: pulseGlow 1s infinite alternate; }
        @keyframes pulseGlow { from { filter: drop-shadow(0 0 4px rgba(255, 165, 0, 0.6)); } to { filter: drop-shadow(0 0 12px rgba(255, 69, 0, 0.9)); } }
        
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .bg-pattern { background-image: radial-gradient(#e2e8f0 2px, transparent 2px); background-size: 24px 24px; }
        .theme-angkasa { background: linear-gradient(to bottom, #1e1b4b, #312e81); color: white; }
        .theme-hutan { background: linear-gradient(to bottom, #14532d, #166534); color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SISTEM AUDIO RINGKAS ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        const playTone = (freq, type, duration, vol=0.1) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        };
        const sounds = {
            correct: () => { playTone(600, 'sine', 0.1); setTimeout(() => playTone(800, 'sine', 0.2), 100); },
            wrong: () => { playTone(300, 'sawtooth', 0.3); setTimeout(() => playTone(250, 'sawtooth', 0.4), 150); },
            coin: () => playTone(1200, 'square', 0.1, 0.05),
            levelup: () => { playTone(400, 'sine', 0.1); setTimeout(() => playTone(500, 'sine', 0.1), 100); setTimeout(() => playTone(600, 'sine', 0.4), 200); }
        };
        const speak = (text) => {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ms-MY';
            window.speechSynthesis.speak(msg);
        };

        // --- KOMPONEN MASKOT: TAMBI ---
        const Tambi = ({ mood = 'idle', size = 120, className = '' }) => {
            let eyes = <path d="M 35 45 Q 40 40 45 45 M 75 45 Q 80 40 85 45" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round"/>;
            let mouth = <path d="M 50 65 Q 60 70 70 65" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round"/>;
            let bg = "#38bdf8"; // Biru langit
            let anim = "bounce-soft";

            if (mood === 'happy') {
                eyes = <path d="M 30 45 Q 40 35 50 45 M 70 45 Q 80 35 90 45" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round"/>;
                mouth = <path d="M 45 65 Q 60 80 75 65 Z" fill="#1e293b"/>;
            } else if (mood === 'excited') {
                eyes = <text x="35" y="50" fontSize="18">⭐</text><text x="70" y="50" fontSize="18">⭐</text>;
                mouth = <path d="M 40 65 Q 60 85 80 65 Z" fill="#ef4444"/>;
                bg = "#fde047"; anim = "animate-bounce";
            } else if (mood === 'thinking') {
                eyes = <><circle cx="40" cy="45" r="5" fill="#1e293b"/><circle cx="80" cy="40" r="8" fill="#1e293b"/></>;
                mouth = <path d="M 55 65 Q 60 65 65 65" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round"/>;
            } else if (mood === 'sad') {
                eyes = <path d="M 35 45 Q 40 40 45 45 M 75 45 Q 80 40 85 45" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round"/>;
                mouth = <path d="M 50 70 Q 60 65 70 70" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round"/>;
                bg = "#cbd5e1";
            }

            return (
                <div className={`${anim} ${className}`} style={{ width: size, height: size }}>
                    <svg viewBox="0 0 120 120" width="100%" height="100%">
                        {/* Antenna */}
                        <line x1="60" y1="25" x2="60" y2="10" stroke="#94a3b8" strokeWidth="4"/>
                        <circle cx="60" cy="8" r="5" fill="#ef4444"/>
                        {/* Head */}
                        <rect x="20" y="25" width="80" height="70" rx="20" fill={bg} stroke="#0ea5e9" strokeWidth="4"/>
                        {/* Screen */}
                        <rect x="30" y="35" width="60" height="45" rx="10" fill="#ffffff" stroke="#e0f2fe" strokeWidth="2"/>
                        {eyes}
                        {mouth}
                        {/* Cheeks */}
                        {(mood === 'happy' || mood === 'excited') && (
                            <><circle cx="35" cy="55" r="4" fill="#fca5a5" opacity="0.6"/><circle cx="85" cy="55" r="4" fill="#fca5a5" opacity="0.6"/></>
                        )}
                    </svg>
                </div>
            );
        };

        // --- DATA & KONFIGURASI ---
        const INITIAL_STATE = {
            name: "", age: null, level: 1, xp: 0, coins: 0, hearts: 5, lastHeartLoss: null, streak: 0, bestStreak: 0,
            progress: { unit: 1, node: 1 },
            stats: { lessonsCompleted: 0, correctAnswers: 0, bossesDefeated: 0 },
            inventory: { hats: [], theme: 'default' },
            activeHat: null,
            dailyQuests: [
                { id: 1, text: "Jawab 10 soalan betul", target: 10, progress: 0, done: false },
                { id: 2, text: "Dapatkan 5 streak", target: 5, progress: 0, done: false }
            ],
            lastLogin: new Date().toDateString()
        };

        const LEVEL_XP = [0, 200, 500, 900, 1400, 2000, 2700, 3500];
        const getLevel = (xp) => {
            let l = 1;
            for(let i=1; i<LEVEL_XP.length; i++) { if(xp >= LEVEL_XP[i]) l = i+1; else break; }
            return l;
        };

        const UNITS = [
            { id: 1, title: "Dunia Nombor", nodes: [
                { id: 1, type: 'lesson', title: "Kenal Tambah", max: 5 },
                { id: 2, type: 'lesson', title: "Tambah Hingga 10", max: 10 },
                { id: 3, type: 'boss', title: "BOSS LEVEL", hp: 3, name: "Raja Keliru", max: 10 }
            ]},
            { id: 2, title: "Pulau Tambah", nodes: [
                { id: 1, type: 'lesson', title: "Tambah Hingga 20", max: 20 },
                { id: 2, type: 'lesson', title: "Nombor Hilang", max: 20, isMissing: true },
                { id: 3, type: 'boss', title: "BOSS LEVEL", hp: 5, name: "Gergasi Sifar", max: 20 }
            ]}
        ];

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [state, setState] = useState(() => {
                const saved = localStorage.getItem('tambah_save');
                if (saved) {
                    let parsed = JSON.parse(saved);
                    // Reset daily quests if new day
                    if (parsed.lastLogin !== new Date().toDateString()) {
                        parsed.lastLogin = new Date().toDateString();
                        parsed.dailyQuests.forEach(q => { q.progress = 0; q.done = false; });
                    }
                    return parsed;
                }
                return INITIAL_STATE;
            });

            const [view, setView] = useState(state.name ? 'home' : 'onboarding');
            const [audioEnabled, setAudioEnabled] = useState(true);

            // Simpan ke local storage setiap kali state berubah
            useEffect(() => {
                localStorage.setItem('tambah_save', JSON.stringify(state));
            }, [state]);

            // Heart Regeneration (1 every 15 mins)
            useEffect(() => {
                const interval = setInterval(() => {
                    if (state.hearts < 5 && state.lastHeartLoss) {
                        const now = new Date().getTime();
                        const diff = now - state.lastHeartLoss;
                        const mins = Math.floor(diff / 60000);
                        if (mins >= 15) {
                            setState(s => ({ ...s, hearts: Math.min(5, s.hearts + 1), lastHeartLoss: s.hearts + 1 < 5 ? new Date().getTime() : null }));
                        }
                    }
                }, 10000); // Check every 10s
                return () => clearInterval(interval);
            }, [state.hearts, state.lastHeartLoss]);

            const updateState = (updates) => setState(s => ({ ...s, ...updates }));

            const addXP = (amount) => {
                setState(s => {
                    const newXP = s.xp + amount;
                    const oldLevel = getLevel(s.xp);
                    const newLevel = getLevel(newXP);
                    if (newLevel > oldLevel) {
                        setTimeout(() => { if(audioEnabled) sounds.levelup(); alert(`LEVEL NAIK! 🚀\nSekarang kamu Level ${newLevel}!\n+100 Syiling!`); }, 500);
                        return { ...s, xp: newXP, level: newLevel, coins: s.coins + 100 };
                    }
                    return { ...s, xp: newXP };
                });
            };

            const addCoins = (amount) => setState(s => ({ ...s, coins: s.coins + amount }));
            
            const loseHeart = () => {
                setState(s => ({ 
                    ...s, 
                    hearts: Math.max(0, s.hearts - 1), 
                    lastHeartLoss: s.hearts === 5 ? new Date().getTime() : s.lastHeartLoss,
                    streak: 0
                }));
            };

            const updateQuest = (id, amount=1) => {
                setState(s => {
                    const qs = [...s.dailyQuests];
                    const q = qs.find(x => x.id === id);
                    if(q && !q.done) {
                        q.progress += amount;
                        if(q.progress >= q.target) {
                            q.done = true;
                            setTimeout(() => alert(`DAILY QUEST SELESAI! 🎉\n${q.text}\n+50 Syiling!`), 1000);
                            s.coins += 50;
                            s.xp += 50;
                        }
                    }
                    return { ...s, dailyQuests: qs };
                });
            };

            // --- UI COMPONENTS ---
            const Header = () => (
                <div className="bg-white p-4 shadow-sm flex justify-between items-center rounded-b-2xl z-10 relative">
                    <div className="flex items-center gap-3">
                        <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center font-bold text-blue-500 text-xl border-2 border-blue-200">
                            {state.name.charAt(0).toUpperCase() || 'M'}
                        </div>
                        <div>
                            <h2 className="font-bold text-gray-800 text-sm">{state.name}</h2>
                            <div className="flex gap-2 text-xs font-bold mt-1">
                                <span className="bg-yellow-100 text-yellow-600 px-2 py-0.5 rounded-full">⭐ Lvl {getLevel(state.xp)}</span>
                                <span className="bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full flex items-center gap-1">
                                    <i className="fa-solid fa-coins"></i> {state.coins}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div className="flex flex-col items-end gap-1 font-bold text-sm">
                        <div className="flex gap-1">
                            {[...Array(5)].map((_, i) => (
                                <i key={i} className={`fa-solid fa-heart ${i < state.hearts ? 'text-red-500' : 'text-gray-200'}`}></i>
                            ))}
                        </div>
                        {state.streak > 2 && (
                            <div className="text-orange-500 flex items-center gap-1 fire-glow pop-in">
                                <i className="fa-solid fa-fire"></i> {state.streak} Streak
                            </div>
                        )}
                    </div>
                </div>
            );

            const BottomNav = () => (
                <div className="bg-white p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] flex justify-around rounded-t-2xl z-10 relative mt-auto">
                    {[
                        { id: 'home', icon: 'fa-house', label: 'Utama' },
                        { id: 'map', icon: 'fa-map', label: 'Peta' },
                        { id: 'shop', icon: 'fa-store', label: 'Kedai' },
                        { id: 'profile', icon: 'fa-user', label: 'Profil' }
                    ].map(nav => (
                        <button key={nav.id} onClick={() => setView(nav.id)} 
                            className={`flex flex-col items-center p-2 rounded-xl transition-all ${view === nav.id ? 'text-blue-500 scale-110' : 'text-gray-400 hover:text-blue-300'}`}>
                            <i className={`fa-solid ${nav.icon} text-xl mb-1`}></i>
                            <span className="text-[10px] font-bold">{nav.label}</span>
                        </button>
                    ))}
                </div>
            );

            // --- SCREENS ---

            // 1. ONBOARDING
            if (view === 'onboarding') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center bg-gradient-to-b from-blue-400 to-blue-600 text-white p-6">
                        <Tambi mood="happy" size={150} className="mb-6" />
                        <h1 className="text-4xl font-black mb-2 drop-shadow-md">TAMBAH</h1>
                        <p className="text-blue-100 font-bold mb-8 italic">"Tambah Ilmu, Naik Level!"</p>
                        
                        <div className="bg-white/20 p-6 rounded-3xl w-full backdrop-blur-sm shadow-xl">
                            <p className="text-center font-bold text-lg mb-4">Hai! Saya Tambi! 🤖<br/>Apa nama kamu?</p>
                            <input type="text" id="playerName" placeholder="Nama Hero..." className="w-full text-center text-gray-800 font-bold text-xl py-3 rounded-xl mb-4 border-none focus:ring-4 ring-yellow-400 outline-none" />
                            <button onClick={() => {
                                const val = document.getElementById('playerName').value;
                                if(val) { updateState({ name: val }); setView('home'); }
                            }} className="w-full bg-yellow-400 hover:bg-yellow-300 text-yellow-900 font-black py-4 rounded-xl shadow-[0_4px_0_#ca8a04] active:translate-y-1 active:shadow-none transition-all">MULA PENGEMBARAAN! 🚀</button>
                        </div>
                    </div>
                );
            }

            // 4. LESSON ENGINE (Gameplay)
            if (view === 'lesson' || view === 'boss') {
                const currentUnit = UNITS.find(u => u.id === state.progress.unit);
                const currentNode = currentUnit.nodes.find(n => n.id === state.progress.node);
                const isBoss = view === 'boss';

                return <LessonEngine 
                    node={currentNode} 
                    isBoss={isBoss}
                    state={state} 
                    updateState={updateState} 
                    addXP={addXP} 
                    addCoins={addCoins} 
                    loseHeart={loseHeart}
                    updateQuest={updateQuest}
                    audioEnabled={audioEnabled}
                    sounds={sounds}
                    speak={speak}
                    onComplete={() => {
                        // Majukan progress jika berjaya
                        if(state.progress.node === currentUnit.nodes.length) {
                            if(state.progress.unit < UNITS.length) {
                                updateState({ progress: { unit: state.progress.unit + 1, node: 1 } });
                            }
                        } else {
                            updateState({ progress: { unit: state.progress.unit, node: state.progress.node + 1 } });
                        }
                        setView('map');
                    }}
                    onClose={() => setView('map')}
                />;
            }

            // MAIN LAYOUT WRAPPER
            return (
                <div className={`app-container ${state.inventory.theme === 'angkasa' ? 'theme-angkasa' : state.inventory.theme === 'hutan' ? 'theme-hutan' : 'bg-pattern'}`}>
                    <Header />
                    <div className="flex-1 overflow-y-auto hide-scrollbar p-4">
                        
                        {/* 2. HOME SCREEN */}
                        {view === 'home' && (
                            <div className="animate-fade-in flex flex-col h-full">
                                <div className="flex items-center gap-4 bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm mb-6 mt-4">
                                    <Tambi mood="idle" size={80} />
                                    <div>
                                        <h2 className="text-xl font-bold text-gray-800">Hai, {state.name}! 👋</h2>
                                        <p className="text-sm font-semibold text-gray-500">Bersedia untuk tambah hari ini?</p>
                                    </div>
                                </div>

                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-6 flex-1 flex flex-col justify-center items-center text-center">
                                    <h3 className="font-bold text-gray-400 mb-2">MISI HARIAN</h3>
                                    <div className="w-full space-y-3 mb-6">
                                        {state.dailyQuests.map(q => (
                                            <div key={q.id} className="bg-gray-50 rounded-xl p-3 flex justify-between items-center border border-gray-100">
                                                <span className={`text-sm font-bold ${q.done ? 'text-green-500 line-through' : 'text-gray-700'}`}>{q.text}</span>
                                                <span className="text-sm font-bold bg-blue-100 text-blue-600 px-2 py-1 rounded-lg">{q.progress} / {q.target}</span>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <button onClick={() => {
                                        if(state.hearts === 0) alert("OH TIDAK! 💔\nHati kamu sudah habis. Tunggu untuk pulih.");
                                        else setView('map');
                                    }} className="w-full bg-green-500 hover:bg-green-400 text-white font-black text-xl py-5 rounded-2xl shadow-[0_6px_0_#16a34a] active:translate-y-2 active:shadow-none transition-all">
                                        TERUSKAN BELAJAR
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 3. MAP SCREEN */}
                        {view === 'map' && (
                            <div className="pb-20">
                                <h1 className="text-2xl font-black text-center mb-6 mt-4 drop-shadow-sm">Peta Pengembaraan</h1>
                                {UNITS.map(unit => (
                                    <div key={unit.id} className="mb-10 relative">
                                        <div className="bg-blue-600 text-white font-bold py-2 px-6 rounded-full inline-block mx-auto mb-6 shadow-md shadow-blue-200">
                                            UNIT {unit.id}: {unit.title.toUpperCase()}
                                        </div>
                                        <div className="flex flex-col items-center space-y-8 relative">
                                            {/* Line connecting nodes */}
                                            <div className="absolute w-2 bg-blue-200 h-full left-1/2 transform -translate-x-1/2 z-0 rounded-full"></div>
                                            
                                            {unit.nodes.map((node, idx) => {
                                                const isUnlocked = unit.id < state.progress.unit || (unit.id === state.progress.unit && node.id <= state.progress.node);
                                                const isCurrent = unit.id === state.progress.unit && node.id === state.progress.node;
                                                const isCompleted = unit.id < state.progress.unit || (unit.id === state.progress.unit && node.id < state.progress.node);
                                                const isBoss = node.type === 'boss';

                                                return (
                                                    <button key={node.id} 
                                                        disabled={!isUnlocked}
                                                        onClick={() => {
                                                            if(state.hearts === 0) { alert("Hati habis! 💔 Tunggu ia pulih."); return; }
                                                            updateState({ progress: { unit: unit.id, node: node.id } });
                                                            setView(isBoss ? 'boss' : 'lesson');
                                                        }}
                                                        className={`relative z-10 w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold transition-transform shadow-lg border-4
                                                            ${isCompleted ? 'bg-green-400 text-white border-green-600 scale-95' : 
                                                              isCurrent ? 'bg-yellow-400 text-yellow-900 border-yellow-600 scale-110 animate-bounce' : 
                                                              'bg-gray-200 text-gray-400 border-gray-300'}
                                                        `}>
                                                        {isCompleted ? '⭐' : isCurrent ? (isBoss ? '👑' : '▶️') : '🔒'}
                                                        
                                                        {/* Label Node */}
                                                        <div className={`absolute top-24 w-32 text-center text-xs font-bold ${isCurrent ? 'text-gray-800' : 'text-gray-500'}`}>
                                                            {node.title}
                                                        </div>
                                                    </button>
                                                )
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 5. SHOP SCREEN */}
                        {view === 'shop' && (
                            <div className="animate-pop-in">
                                <h1 className="text-2xl font-black text-center mb-6 mt-4">KEDAI TAMBI</h1>
                                <div className="grid grid-cols-2 gap-4">
                                    {[
                                        { id: 'default', name: 'Tema Biasa', type: 'theme', price: 0, icon: 'fa-sun' },
                                        { id: 'angkasa', name: 'Tema Angkasa', type: 'theme', price: 500, icon: 'fa-rocket' },
                                        { id: 'hutan', name: 'Tema Hutan', type: 'theme', price: 500, icon: 'fa-tree' }
                                    ].map(item => {
                                        const isOwned = state.inventory.theme === item.id || (item.price === 0);
                                        const isActive = state.inventory.theme === item.id;
                                        return (
                                            <div key={item.id} className={`p-4 rounded-2xl border-2 flex flex-col items-center text-center bg-white ${isActive ? 'border-green-500 shadow-md' : 'border-gray-200'}`}>
                                                <i className={`fa-solid ${item.icon} text-4xl mb-3 ${isActive ? 'text-green-500' : 'text-gray-400'}`}></i>
                                                <h3 className="font-bold text-sm mb-2 text-gray-700">{item.name}</h3>
                                                {isOwned ? (
                                                    <button onClick={() => updateState({ inventory: { ...state.inventory, theme: item.id } })} 
                                                        className={`w-full py-2 rounded-lg font-bold text-xs ${isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'}`}>
                                                        {isActive ? 'DIPAKAI' : 'GUNA'}
                                                    </button>
                                                ) : (
                                                    <button onClick={() => {
                                                        if(state.coins >= item.price) {
                                                            addCoins(-item.price);
                                                            updateState({ inventory: { ...state.inventory, theme: item.id } });
                                                            if(audioEnabled) sounds.coin();
                                                        } else alert('Syiling tidak mencukupi!');
                                                    }} className="w-full py-2 bg-yellow-400 text-yellow-900 rounded-lg font-bold text-xs flex items-center justify-center gap-1">
                                                        <i className="fa-solid fa-coins"></i> {item.price}
                                                    </button>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {/* 6. PROFILE SCREEN */}
                        {view === 'profile' && (
                            <div className="animate-pop-in">
                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mt-4 text-center">
                                    <div className="w-24 h-24 bg-blue-100 rounded-full mx-auto flex items-center justify-center text-4xl font-bold text-blue-500 border-4 border-blue-200 mb-4">
                                        {state.name.charAt(0)}
                                    </div>
                                    <h2 className="text-2xl font-black text-gray-800">{state.name}</h2>
                                    <p className="font-bold text-gray-500 mb-4">Matematik Hero</p>
                                    
                                    <div className="w-full bg-gray-100 h-4 rounded-full overflow-hidden mb-2 relative">
                                        <div className="bg-green-500 h-full" style={{width: `${(state.xp / LEVEL_XP[getLevel(state.xp)]) * 100}%`}}></div>
                                    </div>
                                    <p className="text-xs font-bold text-gray-500">XP: {state.xp} / {LEVEL_XP[getLevel(state.xp)]}</p>

                                    <div className="grid grid-cols-2 gap-4 mt-6">
                                        <div className="bg-blue-50 p-4 rounded-xl">
                                            <i className="fa-solid fa-check-circle text-2xl text-blue-500 mb-1"></i>
                                            <h4 className="text-xl font-black text-gray-800">{state.stats.correctAnswers}</h4>
                                            <p className="text-xs font-bold text-gray-500">Jawapan Betul</p>
                                        </div>
                                        <div className="bg-orange-50 p-4 rounded-xl">
                                            <i className="fa-solid fa-fire text-2xl text-orange-500 mb-1"></i>
                                            <h4 className="text-xl font-black text-gray-800">{state.bestStreak}</h4>
                                            <p className="text-xs font-bold text-gray-500">Streak Terbaik</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                    <BottomNav />
                </div>
            );
        };

        // --- KOMPONEN ENJIN PELAJARAN (LESSON & BOSS) ---
        const LessonEngine = ({ node, isBoss, state, updateState, addXP, addCoins, loseHeart, updateQuest, audioEnabled, sounds, speak, onComplete, onClose }) => {
            const totalQ = isBoss ? node.hp : 10;
            const [qIndex, setQIndex] = useState(0);
            const [questions, setQuestions] = useState([]);
            const [ansState, setAnsState] = useState('idle'); // idle, correct, wrong
            const [userAns, setUserAns] = useState('');
            const [bossHP, setBossHP] = useState(node.hp);

            // Generate Questions based on node configs
            useEffect(() => {
                const qs = [];
                for(let i=0; i<totalQ; i++) {
                    const max = node.max || 10;
                    let a, b, ans;
                    if(node.isMissing) {
                        ans = Math.floor(Math.random() * max) + 1;
                        b = Math.floor(Math.random() * (max - ans + 1));
                        a = ans - b;
                    } else {
                        a = Math.floor(Math.random() * (max/2)) + 1;
                        b = Math.floor(Math.random() * (max/2)) + 1;
                        ans = a + b;
                    }
                    
                    // Mix question types
                    const types = ['choice', 'type'];
                    if(!node.isMissing && max <= 10) types.push('visual');
                    const type = types[Math.floor(Math.random() * types.length)];
                    
                    let options = [];
                    if(type === 'choice') {
                        options = [ans, ans+1, ans-1, ans+2].sort(() => Math.random() - 0.5);
                    }

                    qs.push({ a, b, ans, type, isMissing: node.isMissing, options });
                }
                setQuestions(qs);
            }, [node, totalQ]);

            if(questions.length === 0) return <div>Memuatkan...</div>;

            const q = questions[qIndex];

            const checkAnswer = (val) => {
                const isCorrect = parseInt(val) === q.ans;
                setUserAns(val);
                setAnsState(isCorrect ? 'correct' : 'wrong');
                
                if(isCorrect) {
                    if(audioEnabled) sounds.correct();
                    addXP(10);
                    updateQuest(1, 1); // target jawapan betul
                    const newStreak = state.streak + 1;
                    updateState({ streak: newStreak, bestStreak: Math.max(state.bestStreak, newStreak) });
                    if(newStreak % 5 === 0) updateQuest(2, 1); // target streak
                    if(isBoss) setBossHP(h => h - 1);
                } else {
                    if(audioEnabled) sounds.wrong();
                    loseHeart();
                }
            };

            const nextQuestion = () => {
                if(isBoss && bossHP <= 0) {
                    if(audioEnabled) sounds.levelup();
                    alert("BOSS DIKALAHKAN! 🏆\n+200 XP\n+200 Syiling");
                    addXP(200); addCoins(200); updateState({ stats: { ...state.stats, bossesDefeated: state.stats.bossesDefeated + 1 }});
                    onComplete();
                } else if(qIndex + 1 < totalQ) {
                    setQIndex(prev => prev + 1);
                    setAnsState('idle');
                    setUserAns('');
                } else {
                    // Lesson complete
                    if(audioEnabled) sounds.levelup();
                    const isPerfect = state.streak >= 10;
                    const bonusXP = isPerfect ? 100 : 50;
                    const bonusCoin = isPerfect ? 50 : 20;
                    alert(`PELAJARAN SELESAI! 🎉\n+${bonusXP} XP\n+${bonusCoin} Syiling`);
                    addXP(bonusXP); addCoins(bonusCoin);
                    updateState({ stats: { ...state.stats, lessonsCompleted: state.stats.lessonsCompleted + 1 }});
                    onComplete();
                }
            };

            return (
                <div className="absolute inset-0 bg-white z-50 flex flex-col p-4 animate-pop-in">
                    {/* Header bar */}
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark text-2xl"></i></button>
                        <div className="flex-1 mx-4 h-4 bg-gray-100 rounded-full overflow-hidden">
                            <div className={`h-full transition-all duration-500 ${isBoss ? 'bg-red-500' : 'bg-green-500'}`} style={{width: `${(qIndex / totalQ) * 100}%`}}></div>
                        </div>
                        <div className="font-bold text-red-500 flex items-center gap-1">
                            <i className="fa-solid fa-heart"></i> {state.hearts}
                        </div>
                    </div>

                    {isBoss && (
                        <div className="text-center mb-6 bg-red-100 rounded-xl p-3 border-2 border-red-200">
                            <h3 className="font-black text-red-700 mb-1">{node.name}</h3>
                            <div className="flex justify-center gap-1">
                                {[...Array(node.hp)].map((_,i) => <i key={i} className={`fa-solid fa-heart ${i < bossHP ? 'text-red-600 animate-pulse' : 'text-gray-300'}`}></i>)}
                            </div>
                        </div>
                    )}

                    {/* Question Display */}
                    <div className="flex-1 flex flex-col justify-center mb-24 relative">
                        {ansState === 'idle' && (
                            <div className="text-center mb-8">
                                <button onClick={() => speak(q.isMissing ? "Cari nombor yang hilang." : "Berapakah jawapannya?")} className="bg-blue-100 text-blue-500 p-3 rounded-full mb-4 shadow-sm active:scale-95">
                                    <i className="fa-solid fa-volume-high"></i>
                                </button>
                                <h2 className="text-xl font-bold text-gray-500 mb-6">{q.isMissing ? "Cari nombor yang hilang." : "Berapakah jawapannya?"}</h2>
                                
                                {q.type === 'visual' ? (
                                    <div className="text-4xl font-black text-gray-800 flex justify-center items-center flex-wrap gap-4">
                                        <div className="flex flex-wrap max-w-[120px] justify-center">
                                            {[...Array(q.a)].map((_,i)=><span key={i}>🍎</span>)}
                                        </div>
                                        <span className="text-blue-500">+</span>
                                        <div className="flex flex-wrap max-w-[120px] justify-center">
                                            {[...Array(q.b)].map((_,i)=><span key={i}>🍎</span>)}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-6xl font-black text-gray-800 flex justify-center items-center gap-4">
                                        {q.isMissing ? (
                                            <> <div className="w-16 h-16 border-4 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-gray-400">?</div> <span className="text-blue-500">+</span> <span>{q.b}</span> <span className="text-blue-500">=</span> <span>{q.a + q.b}</span> </>
                                        ) : (
                                            <> <span>{q.a}</span> <span className="text-blue-500">+</span> <span>{q.b}</span> <span className="text-blue-500">=</span> <div className="w-16 h-16 border-4 border-dashed border-gray-300 rounded-xl flex items-center justify-center text-gray-400">?</div> </>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Answers Input / Panel */}
                        {ansState === 'idle' && q.type === 'choice' && (
                            <div className="grid grid-cols-2 gap-4">
                                {q.options.map((opt, i) => (
                                    <button key={i} onClick={() => checkAnswer(opt)} className="bg-white border-2 border-gray-200 py-6 rounded-2xl text-3xl font-black text-gray-700 shadow-sm active:bg-blue-50 active:border-blue-400 transition-colors">
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        )}

                        {ansState === 'idle' && q.type === 'type' && (
                            <div>
                                <div className="text-center text-4xl font-black mb-6 text-blue-600 min-h-[40px]">{userAns || '_'}</div>
                                <div className="grid grid-cols-3 gap-3">
                                    {[1,2,3,4,5,6,7,8,9].map(num => (
                                        <button key={num} onClick={() => setUserAns(prev => prev + num)} className="bg-gray-100 py-4 rounded-xl text-2xl font-bold active:bg-gray-200">{num}</button>
                                    ))}
                                    <button onClick={() => setUserAns('')} className="bg-red-100 text-red-500 py-4 rounded-xl font-bold text-sm"><i className="fa-solid fa-delete-left text-xl"></i></button>
                                    <button onClick={() => setUserAns(prev => prev + '0')} className="bg-gray-100 py-4 rounded-xl text-2xl font-bold active:bg-gray-200">0</button>
                                    <button onClick={() => { if(userAns !== '') checkAnswer(userAns); }} className="bg-green-500 text-white py-4 rounded-xl font-bold text-sm shadow-[0_4px_0_#16a34a] active:translate-y-1 active:shadow-none transition-all">SEMAK</button>
                                </div>
                            </div>
                        )}
                        {/* Visual type uses choices mostly */}
                        {ansState === 'idle' && q.type === 'visual' && (
                            <div className="grid grid-cols-2 gap-4">
                                {[q.ans, q.ans+1, q.ans-1, q.ans+2].sort(()=>Math.random()-0.5).map((opt, i) => (
                                    <button key={i} onClick={() => checkAnswer(opt)} className="bg-white border-2 border-gray-200 py-6 rounded-2xl text-3xl font-black text-gray-700 shadow-sm active:bg-blue-50">
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Tambi & Feedback Panel Overlay */}
                    {ansState !== 'idle' && (
                        <div className={`absolute bottom-0 left-0 w-full rounded-t-3xl p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] transition-transform duration-300 ${ansState === 'correct' ? 'bg-green-100' : 'bg-red-100'}`}>
                            <div className="flex gap-4 items-center mb-6">
                                <Tambi mood={ansState === 'correct' ? (state.streak >= 3 ? 'excited' : 'happy') : 'sad'} size={80} />
                                <div>
                                    <h3 className={`text-2xl font-black ${ansState === 'correct' ? 'text-green-600' : 'text-red-600'}`}>
                                        {ansState === 'correct' ? 'HEBAT! 🎉' : 'BELUM TEPAT 💔'}
                                    </h3>
                                    <p className={`font-bold ${ansState === 'correct' ? 'text-green-800' : 'text-red-800'}`}>
                                        {ansState === 'correct' ? (state.streak >= 3 ? `Wow! ${state.streak} jawapan berturut-turut! 🔥` : 'Jawapan kamu betul! +10 XP') : 
                                        `Jawapan yang betul ialah ${q.ans}. Tak mengapa, cuba lagi! 💪`}
                                    </p>
                                </div>
                            </div>
                            <button onClick={nextQuestion} className={`w-full py-5 rounded-2xl font-black text-white text-xl transition-all shadow-[0_6px_0_rgba(0,0,0,0.2)] active:translate-y-1 active:shadow-none ${ansState === 'correct' ? 'bg-green-500' : 'bg-red-500'}`}>
                                TERUSKAN
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
